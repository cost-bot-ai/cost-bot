name: kroger-collector

# Manual only for now. Add a `schedule:` trigger after (1) the secrets below exist, (2) a dry run succeeded and
# (3) a real run wrote rows. The daily limit is read from the API's own headers; the run stops at a 50% reserve.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Call the API but write nothing (no database needed)"
        type: boolean
        default: true
      max_requests:
        description: "Hard ceiling on API requests this run"
        type: string
        default: "100"

permissions:
  contents: read

concurrency:
  group: kroger-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # The Kroger and database secrets live in the "cost-bot" GitHub environment, not as repository secrets.
    environment: cost-bot
    timeout-minutes: 30
    env:
      KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
      KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DRY_RUN: ${{ inputs.dry_run }}
      MAX_REQUESTS: ${{ inputs.max_requests }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e '.[db]'

      - name: Check inputs
        run: |
          case "$MAX_REQUESTS" in ''|*[!0-9]*) echo "max_requests must be a number"; exit 2;; esac

      - name: Apply database migrations (real runs only)
        if: ${{ inputs.dry_run == false }}
        run: python scripts/migrate.py

      - name: Collect
        run: |
          flags="--max-requests $MAX_REQUESTS"
          if [ "$DRY_RUN" = "true" ]; then flags="$flags --dry-run"; fi
          python -m collectors.kroger run $flags
