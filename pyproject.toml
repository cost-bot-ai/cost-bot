[project]
name = "pricememory"
version = "0.0.1"
description = "Free consumer price-accountability tracker: gov price/cost series, company margins, shelf-price history."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pipeline*", "collectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
